name: Aplicar preços dos prints
on:
  push:
    paths: ['.github/workflows/aplicar-precos-prints.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar menores preços conferidos nos prints
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          m=re.search(r'const cards=(\[.*?\]);\s*const',s,re.S)
          if not m: m=re.search(r'const cards=(\[.*?\]);',s,re.S)
          cards=json.loads(m.group(1))
          vals={
          ('Maushold','146/128'):150.00,('Meowth de Alola','139/128'):110.00,('Articuno','112/128'):108.90,('Moltres','114/128'):99.99,('Lapras','131/128'):90.00,
