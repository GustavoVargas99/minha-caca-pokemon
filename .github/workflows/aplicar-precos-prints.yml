          ('Pikachu','055/128'):14.99,('Pikachu','062/128'):14.99,('Pikachu','067/128'):14.90,('Mewtwo ex','084/128'):14.90,('Poké Tablet','126/128'):14.89,
          ('Pikachu','058/128'):13.99,('Pikachu','024/128'):13.50,('Pikachu','041/128'):13.50,('Pikachu','048/128'):13.50,('Pikachu','026/128'):12.99,
          ('Pikachu','014/128'):12.50,('Pikachu','022/128'):12.00,('Pikachu','036/128'):12.00,('Pikachu','044/128'):10.99,('Pikachu','050/128'):10.00,
          ('Pikachu','060/128'):10.00,('Pikachu',''):9.50,('Salamence ex','108/128'):9.00,('Pikachu','033/128'):8.00,('Espeon',''):6.00,
          ('Fuecoco ex',''):6.00,('Mew','066/128'):6.00,('Moltres',''):5.00,('Igglybuff','123/128'):5.00,('Lugia',''):4.99,
          ('Lapras','017/128'):4.00,('Ho-Oh','012/128'):3.00,('Lucario','088/128'):2.99,('Unown','072/128'):2.98,('Victini','013/128'):2.40,
