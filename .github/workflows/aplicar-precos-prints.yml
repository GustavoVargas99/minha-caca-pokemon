          ('Toxel','058/128'):0.50,('Morpeko','061/128'):0.50,('Koraidon','086/128'):0.50,('Nidoran Fêmea','087/128'):0.50,('Nidorina','088/128'):0.50,
          ('Scraggy','098/128'):0.50,('Zoroark',''):0.50,('Deino','091/128'):0.50,('Ferrothorn','118/128'):0.50,('Solgaleo',''):0.50,
          ('Jangmo-o','110/128'):0.50,('Tropius','005/128'):0.49,('Lunala',''):0.49,('Meowth de Alola','089/128'):0.49,('Murkrow',''):0.49,
          ('Gholdengo','140/128'):0.49,('Hakamo-o','111/128'):0.30,('Wishiwashi',''):0.29,('Seismitoad',''):0.20,('Gimmighoul',''):0.19}
          def norm(x):
            return (x or '').lower().replace('’',"'").replace('–','-')
          changed=0
          for c in cards:
            best=None; src=None
            for (name,num),price in vals.items():
              cn=norm(c.get('name')); nn=norm(name); cnum=norm(c.get('num'))
              nameok=(nn in cn or cn in nn) if nn else False
              numok=(not num) or (norm(num) in cn or norm(num) in cnum)
              if nameok and numok and (best is None or price<best): best=price; src=(name,num)
            if best is not None:
              old=c.get('price')
              if old is None or best < float(old):
                c['price']=best; c['status']='verificado'; c['note']='Menor dos prints LigaPokémon/MYP Cards • 21/09/2026'
                changed+=1
          new='const cards='+json.dumps(cards,ensure_ascii=False,separators=(',',':'))+';'
          s=s[:m.start()]+new+s[m.end():]
          p.write_text(s,encoding='utf-8')
          print('Preços atualizados:',changed)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Atualiza menores preços pelos prints Liga e MYP' || exit 0
          git push
