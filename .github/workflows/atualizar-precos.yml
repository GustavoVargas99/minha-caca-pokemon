name: Atualizar preços Pokémon

on:
  workflow_dispatch:
  push:
    paths:
      - 'precos.json'
      - 'aplicar_precos.py'
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  group: atualizar-precos-pokemon
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar catálogo
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Aplicar preços manuais ao site
        run: python -u aplicar_precos.py
      - name: Salvar site
        run: |
          git config user.name "Minha Caça Pokémon"
          git config user.email "actions@github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Aplica preços verificados ao site"
          git push
