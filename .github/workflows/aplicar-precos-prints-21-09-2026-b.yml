name: Completar preços dos prints 21-09-2026
on:
  push:
    paths:
      - '.github/workflows/aplicar-precos-prints-21-09-2026-b.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Completar preços dos prints
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re,unicodedata
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          m=re.search(r'const cards=(\[.*?\]);',s,re.S); cards=json.loads(m.group(1))
          def norm(x):
            x=unicodedata.normalize('NFKD',x.lower()).encode('ascii','ignore').decode()
            return re.sub(r'[^a-z0-9]+',' ',x).strip()
          vals={
            'arceus v astro':72.27,'arceus vstar':72.27,'buzzwole gx':79.88,'celebi luminescente':389.00,
            'charizard':2200.00,'crobat':55.58,'cresselia':199.90,'delcatty':50.03,'genesect ex':41.79,
            'gengar':56.25,'giratina':83.82,'jigglypuff de africa':79.00,'lugia':1699.00,
            'm gardevoir ex':190.00,'magikarp':707.75,'metagross':99.98,'mew vmax':89.90,
            'misty':149.99,'n':149.90,'palkia':93.98,'pikachu':244.23,'pikachu e zekrom gx':199.00,
            'pikachu zekrom gx':199.00,'raikou':49.90,'rayquaza ex':199.00,'scizor ex':99.99,
            'sneasel':56.73,'solgaleo gx':79.98,'tyranitar sombrio':151.91,'uxie':99.99,'zacian v':299.00
          }
          changed=[]
          for c in cards:
            if c.get('group') not in ('30C','30CC'): continue
            n=norm(c.get('name',''))
            matches=[(k,v) for k,v in vals.items() if n==k or n.startswith(k+' ')]
            if not matches: continue
            k,v=max(matches,key=lambda kv:len(kv[0]))
            if c.get('price') is None or (k=='gengar' and c.get('price')==565.25):
              c['price']=v; c['status']='verificado'; c['note']='Print enviado pelo usuário • menor preço exibido • 21/09/2026'; changed.append((c.get('name'),v))
          new='const cards='+json.dumps(cards,ensure_ascii=False,separators=(',',':'))+';'
          s=s[:m.start()]+new+s[m.end():]; p.write_text(s,encoding='utf-8')
          print('Alterados:',len(changed)); print(*changed,sep='\n')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Completa preços restantes dos prints - 21-09-2026' || exit 0
          git push
