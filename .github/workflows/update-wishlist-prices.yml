name: Atualizar mais preços

on:
  push:
    paths:
      - '.github/workflows/update-wishlist-prices.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar mais preços verificados
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          vals={
            ('Dark Arbok','19/82'):(120.0,'MYP Cards • NM • Foil • verificado em 21/09/2026'),
            ('Dark Vileplume','30/82'):(15.0,'MYP Cards • SP • verificado em 21/09/2026'),
            ('Dark Weezing','31/82'):(15.0,'MYP Cards • NM • verificado em 21/09/2026'),
            ('Dark Charmeleon','32/82'):(25.0,'MYP Cards • NM • verificado em 21/09/2026'),
            ('Dark Gloom','36/82'):(20.0,'MYP Cards • NM • verificado em 21/09/2026'),
            ('Dark Vaporeon','45/82'):(15.0,'MYP Cards • SP • verificado em 21/09/2026'),
          }
          import re
          changed=0
          for (name,num),(price,note) in vals.items():
              pat=r'(\{"group": "Team Rocket Dark", "name": "'+re.escape(name)+r'", "num": "'+re.escape(num)+r'", "img": "[^"]*", )"price": null, "note": "[^"]*", "status": "pesquisar"'
              repl=r'\1"price": '+str(price)+', "note": "'+note+r'", "status": "verificado"'
              s,n=re.subn(pat,repl,s,count=1)
              changed+=n
              print(name,num,'alterado' if n else 'não encontrado')
          if changed==0:
              raise SystemExit('Nenhuma alteração encontrada')
          p.write_text(s,encoding='utf-8')
          print('Total de novos preços:',changed)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Adiciona mais preços verificados Team Rocket'
          git push
