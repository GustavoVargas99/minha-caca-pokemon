name: Corrigir preços online verificados

on:
  push:
    paths:
      - '.github/workflows/update-wishlist-prices.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar ofertas atuais confirmadas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          m=re.search(r'const cards=(\[.*?\]);',s,re.S)
          if not m: raise SystemExit('cards não encontrado')
          cards=json.loads(m.group(1))
          # Somente ofertas atuais confirmadas diretamente no MYP Cards.
          # Não usar resultados antigos/indexados como preço válido.
          vals={
            'Zapdos ex 202/165':(390.00,'MYP Cards • página da carta • 19 unidades a partir de R$390 • verificado em 21/09/2026'),
            'Mewtwo 052/∞':(39.99,'MYP Cards • NM • oferta atual disponível • verificado em 21/09/2026'),
          }
          changed=0
          for c in cards:
            if c.get('group')=='Wishlist' and c.get('name') in vals:
              price,note=vals[c['name']]
              if c.get('price')!=price or c.get('note')!=note:
                c['price']=price; c['note']=note; c['status']='verificado'; changed+=1
          new='const cards='+json.dumps(cards,ensure_ascii=False,separators=(',',':'))+';'
          s=s[:m.start()]+new+s[m.end():]
          p.write_text(s,encoding='utf-8')
          print('Preços corrigidos/adicionados:',changed)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Corrige preços online verificados - 21-09-2026' || exit 0
          git push
